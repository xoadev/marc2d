product: android/app

repositories:
  - https://download.linphone.org/maven_repository

dependencies:
  - $compose.material3
  - $libs.activity.compose
  - $libs.camera.camera2
  - $libs.camera.lifecycle
  - $libs.camera.view
  - $libs.datastore.preferences
  - $libs.ktor.client.okhttp
  - $libs.ktor.client.websockets
  - $libs.linphone.sdk
  - $libs.zxing.core

settings:
  android:
    namespace: dev.xoa.marc2d
    # Android 15, the version on the Pixel 3a with LineageOS 22.
    minSdk: 35
    versionName: 0.1.0
    # Both Pixels are arm64: Linphone's other ABIs only bloat the APK.
    abiFilters: [ arm64-v8a ]
  compose: enabled
  kotlin:
    serialization: json

test-dependencies:
  - $libs.ktor.server.cio
  - $libs.ktor.server.websockets

plugins:
  ktlint: enabled
