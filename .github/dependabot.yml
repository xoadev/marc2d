version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Only versions at least a week old, as AGENTS.md asks.
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    # Only versions at least a week old, as AGENTS.md asks.
    cooldown:
      default-days: 7
