name: release

# Publishes the Android app as a GitHub release, on a tag vX.Y.Z: a signed APK, its hash and convco's changelog. No stores.
# Home Assistant finds it there and offers it to the panels (SPEC.md, Updates).
#
# It needs an environment `production` that only admits the tags v*.*.*, so that no other branch can read the key, with:
#   SIGNING_KEYSTORE        the keystore, in base64
#   SIGNING_STORE_PASSWORD
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Never cut in half, and a run must not overwrite another's files.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ktlint, Compose rules and tests
        run: make app-check

  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # convco reads every commit since the last tag

      - name: Changelog
        id: convco
        uses: xoadev/convco-version@e8cf4f03b64bbbb8b2e10cecdab9c99ada457e9c # v1.1.0

      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/marc2d.jks"
          {
            echo "storeFile=$RUNNER_TEMP/marc2d.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > app/keystore.properties

      # The code only has to grow, and the run number always does. It starts above 1, what debug builds use.
      - name: Build the signed APK
        run: make release VERSION="${GITHUB_REF_NAME#v}" VERSION_CODE="$((100 + GITHUB_RUN_NUMBER))"

      - name: Hash
        working-directory: build
        run: sha256sum marc2d.apk > marc2d.apk.sha256

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ steps.convco.outputs.changelog }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A re-run of the same tag.
            gh release upload "$GITHUB_REF_NAME" build/marc2d.apk build/marc2d.apk.sha256 --clobber
            gh release edit "$GITHUB_REF_NAME" --notes "$CHANGELOG"
          else
            gh release create "$GITHUB_REF_NAME" build/marc2d.apk build/marc2d.apk.sha256 --title "$GITHUB_REF_NAME" --notes "$CHANGELOG"
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/marc2d.jks" app/keystore.properties
