name: release

# Publishes the Android app as a GitHub release, when someone presses Run workflow on main: convco works out the next
# version from the commits, and the release gets its tag, a signed APK, its hash and the changelog. No stores.
# Home Assistant finds it there and offers it to the panels (SPEC.md, Updates).
#
# It needs an environment `production` that only admits the branch main, so that no other branch can read the key, with:
#   SIGNING_KEYSTORE        the keystore, in base64
#   SIGNING_STORE_PASSWORD
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD

on:
  workflow_dispatch:

permissions:
  contents: read

# Two at once would work out the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ktlint, Compose rules and tests
        run: make app-check

  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # convco reads every commit since the last tag

      - name: Next version
        id: convco
        uses: xoadev/convco-version@e8cf4f03b64bbbb8b2e10cecdab9c99ada457e9c # v1.1.0

      # Only feat and fix make a version: what else there is does not change the app.
      - name: Check there is something to release
        env:
          HAS_CHANGES: ${{ steps.convco.outputs.has-changes }}
        run: |
          if [[ "$HAS_CHANGES" != "true" ]]; then
            echo "::error::No feat or fix since the last version: nothing to release"
            exit 1
          fi

      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/marc2d.jks"
          {
            echo "storeFile=$RUNNER_TEMP/marc2d.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > app/keystore.properties

      # The code only has to grow, and the run number always does. It starts above 1, what debug builds use.
      - name: Build the signed APK
        env:
          VERSION: ${{ steps.convco.outputs.next-version }}
        run: make release VERSION="$VERSION" VERSION_CODE="$((100 + GITHUB_RUN_NUMBER))"

      - name: Hash
        working-directory: build
        run: sha256sum marc2d.apk > marc2d.apk.sha256

      # It creates the tag, on the commit just built, and only publishes it once the files are up. A tag created here does
      # not start other workflows, which is why all of this is one.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.convco.outputs.next-version-tag }}
          CHANGELOG: ${{ steps.convco.outputs.changelog }}
        run: gh release create "$TAG" build/marc2d.apk build/marc2d.apk.sha256 --target "$GITHUB_SHA" --title "$TAG" --notes "$CHANGELOG"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/marc2d.jks" app/keystore.properties
